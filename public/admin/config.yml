# Sveltia CMS — panel en /admin
# Docs: https://sveltiacms.app/en/docs
backend:
  name: github
  repo: nurraburu8/codestudiov2
  branch: main
  base_url: https://codestudio-oauth.urraburunicolas.workers.dev
  auth_endpoint: auth

# Todo el material (fotos y videos) se sube a Cloudinary, no al repo.
# La api_key es pública (el secret nunca va acá). Para subir, cada persona
# entra con su usuario de Cloudinary la primera vez que abre el selector.
media_libraries:
  cloudinary:
    config:
      cloud_name: dvdrfqhpy
      api_key: '558428921538224'
      folder:
        path: codestudio/trabajos
    output_filename_only: false
    use_transformations: false

collections:
  - name: trabajos
    label: Trabajos
    label_singular: Trabajo
    description: >-
      Los trabajos aparecen agrupados por sección. Para cambiar el orden en que se
      muestran en cada página, usá el botón **Reordenar** y arrastralos.
    folder: src/content/trabajos
    create: true
    delete: true
    slug: '{{slug}}'
    extension: md
    format: yaml-frontmatter
    summary: "{{archived | ternary('🗄 ARCHIVADO · ', '')}}{{client}} · {{year}}"
    thumbnail: cover
    # Reordenar = arrastrar dentro de cada sección; guarda el campo "order".
    reorder:
      group: seccion
    view_groups:
      groups:
        - { name: seccion, label: Sección, field: category }
        - { name: estado, label: Archivados, field: archived }
      default: seccion
    view_filters:
      - { label: Activos, field: archived, pattern: false }
      - { label: Archivados, field: archived, pattern: true }
    sortable_fields:
      - client
      - year
    fields:
      # ── Datos ─────────────────────────────────────────────
      - { label: Cliente, name: client, widget: string }
      - label: Tipo
        name: type
        widget: select
        options:
          - AFTERMOVIE
          - COMERCIAL
          - VIDEOCLIP
          - DOCUMENTAL
          - EVENTO
          - GIRA
          - BRANDED CONTENT
          - OTRO
      - label: Sección
        name: category
        widget: select
        hint: Página de la web donde aparece el trabajo.
        options:
          - { label: "Shows & Fiestas", value: Shows }
          - { label: "Eventos & Campañas", value: Campañas }
          - { label: "Fotografía Producto", value: Fotografía }
      - { label: "Año", name: year, widget: number, value_type: int, min: 2000, max: 2100 }
      - { label: "Ubicación", name: location, widget: string, default: "Montevideo, Uruguay", required: false }
      - { label: "Frase destacada", name: tagline, widget: string, required: false, hint: Aparece debajo del título en la página del trabajo. }
      - label: Archivado
        name: archived
        widget: boolean
        default: false
        hint: Si está activado, el trabajo deja de mostrarse en la web pero **no se borra**. Se puede volver a activar cuando quieras.

      # ── Archivos (se suben a Cloudinary) ──────────────────
      - label: "1 · Portada"
        name: cover
        widget: image
        required: false
        choose_url: true
        hint: Imagen de la tarjeta del trabajo (horizontal). Si la dejás vacía, se usa un cuadro del video completo.
      - label: "2 · Video completo"
        name: fullVideo
        widget: file
        required: false
        choose_url: true
        accept: video/*
        hint: El video principal que se ve al entrar al trabajo. Subilo acá o pegá el link de Cloudinary.
      - label: "3 · Fotos adicionales"
        name: photos
        widget: image
        multiple: true
        required: false
        choose_url: true
        hint: Se muestran en la página del trabajo, en este orden (arrastralas para reordenar). Podés seleccionar varias a la vez.
      - label: "4 · Videos adicionales"
        name: videos
        widget: list
        required: false
        label_singular: Video
        summary: '{{caption}}'
        hint: Reels, cápsulas, otros cortes. Se muestran en la página del trabajo, en este orden.
        fields:
          - { label: Video, name: src, widget: file, choose_url: true, accept: video/* }
          - { label: "Texto debajo del video (opcional)", name: caption, widget: string, required: false }
      - label: "5 · Clip corto para el slideshow del inicio"
        name: video
        widget: file
        required: false
        choose_url: true
        accept: video/*
        hint: Solo hace falta si el trabajo está en el slideshow de la **Pantalla principal**. Unos 10 segundos, sin sonido, horizontal.

      # ── Opcionales ────────────────────────────────────────
      - label: Créditos (opcional)
        name: credits
        widget: list
        required: false
        label_singular: Crédito
        fields:
          - { label: Rol, name: role, widget: string }
          - { label: Nombre, name: name, widget: string }
      - label: Estadísticas (opcional)
        name: stats
        widget: list
        required: false
        label_singular: Estadística
        hint: Solo datos reales, por ejemplo Año o Edición.
        fields:
          - { label: Etiqueta, name: label, widget: string }
          - { label: Valor, name: value, widget: string }
      - { label: "Descripción", name: body, widget: markdown, required: false }
      - { label: Orden, name: order, widget: hidden, default: 99 }

  - name: inicio
    label: Pantalla principal
    description: >-
      Qué trabajos aparecen en la página de inicio y en qué orden. Acá solo se eligen
      trabajos que ya existen; para crear uno nuevo, andá a **Trabajos**.
    files:
      - name: inicio
        label: Pantalla principal
        file: src/content/inicio.json
        format: json
        fields:
          - label: Slideshow (video arriba de todo)
            name: slideshow
            widget: relation
            multiple: true
            required: false
            collection: trabajos
            value_field: '{{slug}}'
            search_fields: [client]
            display_fields: ['{{client}} · {{year}}']
            hint: >-
              Elegí trabajos que **ya existen** escribiendo su nombre, arrastrá las etiquetas para ordenarlas y quitá con la ✕. El botón "Agregar Trabajo" de este campo crea un trabajo **nuevo**: para elegir uno existente no hace falta. Cada trabajo necesita su **clip corto para el slideshow** cargado; si no, se saltea.
          - label: Proyectos destacados (grilla debajo del slideshow)
            name: destacados
            widget: relation
            multiple: true
            required: false
            collection: trabajos
            value_field: '{{slug}}'
            search_fields: [client]
            display_fields: ['{{client}} · {{year}}']
            hint: >-
              Elegí trabajos que **ya existen** escribiendo su nombre, arrastrá las etiquetas para ordenarlas y quitá con la ✕. El botón "Agregar Trabajo" de este campo crea un trabajo **nuevo**: para elegir uno existente no hace falta.
